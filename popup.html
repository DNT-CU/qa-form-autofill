<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Simple Form Autofill for QA</title>
    <style>
      body {
        font-family: system-ui, Arial;
        margin: 12px;
        width: 220px;
        padding: 24px;
        border-radius: 24px;
      }
      button {
        width: 100%;
        padding: 10px;
        border: solid 1px #c2c5ff;
        border-radius: 8px;
        cursor: pointer;
        background-color: #646CFE;
        color: white;
        font-weight: 500;
        font-size: 1rem;    
        transition: background-color 0.2s, border-color 0.2s;       
      }
      button:hover {
        background-color: #4c52d9; 
      }
      </style>
  </head>
  <body>
    <div class="container">
    <button id="run"><span>Fill Form!</span></button>
    <script src="popup.js"></script>
    </div>
  </body>
</html>
